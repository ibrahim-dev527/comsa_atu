<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Page Not Found – COMSA | ATU</title>
<link rel="icon" type="image/jpeg" href="images/logo.jpg"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400&family=Outfit:wght@300;400;500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--navy:#0B1F3B;--navy2:#071528;--gold:#F4B400;--gold3:#C99300;--bg:#07101E;--card:#0F1E33;--txt:#F0EFE9;--muted:#8BAFC8;--bdr:rgba(244,180,0,.12)}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden}
.mesh{position:fixed;inset:0;background-image:linear-gradient(rgba(244,180,0,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(244,180,0,.03) 1px,transparent 1px);background-size:60px 60px;pointer-events:none}
.orb{position:fixed;border-radius:50%;filter:blur(80px);pointer-events:none}
.orb1{width:400px;height:400px;background:rgba(244,180,0,.05);top:-100px;left:-100px}
.orb2{width:300px;height:300px;background:rgba(11,31,59,.6);bottom:-80px;right:-80px}
.box{text-align:center;max-width:520px;position:relative;z-index:1}
.num{font-family:'Orbitron',monospace;font-size:clamp(5rem,18vw,9rem);font-weight:900;color:var(--gold);line-height:1;opacity:.15;position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);white-space:nowrap;pointer-events:none;user-select:none}
.ic{font-size:3.5rem;margin-bottom:20px;animation:bob 2.8s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.logo{font-family:'Orbitron',monospace;font-size:1rem;color:var(--gold);letter-spacing:.12em;margin-bottom:32px;opacity:.7}
h1{font-family:'Playfair Display',serif;font-size:clamp(1.6rem,4vw,2.4rem);font-weight:700;margin-bottom:12px;line-height:1.2}
h1 em{color:var(--gold);font-style:italic}
p{font-size:.92rem;color:var(--muted);line-height:1.8;max-width:400px;margin:0 auto 32px}
.links{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 24px;border-radius:12px;font-size:.86rem;font-weight:600;cursor:pointer;border:none;font-family:'Outfit',sans-serif;text-decoration:none;transition:transform .3s,box-shadow .3s}
.btn:hover{transform:translateY(-3px)}
.btn-g{background:linear-gradient(135deg,var(--gold),var(--gold3));color:var(--navy);box-shadow:0 8px 24px rgba(244,180,0,.3)}
.btn-g:hover{box-shadow:0 12px 32px rgba(244,180,0,.4)}
.btn-o{background:transparent;border:2px solid rgba(244,180,0,.3);color:var(--muted)}
.btn-o:hover{border-color:var(--gold);color:var(--txt)}
.nav-links-mini{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:28px}
.nav-links-mini a{font-size:.77rem;color:rgba(255,255,255,.3);padding:5px 10px;border-radius:6px;transition:color .3s;text-decoration:none}
.nav-links-mini a:hover{color:var(--gold)}
</style>
</head>
<body>
<div class="mesh"></div>
<div class="orb orb1"></div>
<div class="orb orb2"></div>
<div class="box">
  <div class="num">404</div>
  <div class="ic">📡</div>
  <div class="logo">COMSA · ATU</div>
  <h1>Page <em>Not Found</em></h1>
  <p>The page you're looking for seems to have gone off-air. It may have been moved, deleted, or the link might be wrong.</p>
  <div class="links">
    <a href="index.html" class="btn btn-g">🏠 Back to Homepage</a>
    <a href="contact.html" class="btn btn-o">📞 Contact Us</a>
  </div>
  <div class="nav-links-mini">
    <a href="about.html">About</a>
    <a href="executives.html">Executives</a>
    <a href="events.html">Events</a>
    <a href="blog.html">Blog</a>
    <a href="gallery.html">Gallery</a>
    <a href="past-questions.html">Past Questions</a>
  </div>
</div>
<script>
document.body.style.opacity='0';
requestAnimationFrame(()=>{document.body.style.transition='opacity .5s';document.body.style.opacity='1'});
</script>
</body>
</html>
